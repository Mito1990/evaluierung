openapi: 3.0.3
info:
  title: Vehicle API
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local backend server

paths:
  /vehicles:
    get:
      summary: Get all vehicles
      operationId: getVehicles
      tags:
        - Vehicles
      responses:
        "200":
          description: Successful response with HAL-style _embedded
          content:
            application/json:
              schema:
                type: object
                properties:
                  _embedded:
                    type: object
                    properties:
                      vehicles:
                        type: array
                        items:
                          $ref: "#/components/schemas/VehicleDto"
                required:
                  - _embedded

  /vehicles/{id}:
    delete:
      summary: Delete a vehicle by ID
      operationId: deleteVehicle
      tags:
        - Vehicles
      parameters:
        - name: id
          in: path
          description: ID of the vehicle to delete
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Vehicle deleted successfully (No Content)
        "404":
          description: Vehicle not found

components:
  schemas:
    Link:
      type: object
      properties:
        href:
          type: string
      required:
        - href

    Links:
      type: object
      properties:
        self:
          $ref: "#/components/schemas/Link"
        allVehicles:
          $ref: "#/components/schemas/Link"
        delete:
          $ref: "#/components/schemas/Link"

    VehicleDto:
      type: object
      properties:
        id:
          type: integer
        vehicleType:
          type: string
        created:
          type: string
        mileage:
          type: string
        gearbox:
          type: string
        owner:
          type: integer
        kwAndPs:
          type: string
        hek:
          type: number
          format: double
        taxation:
          type: string
        _links:
          $ref: "#/components/schemas/Links"
      required:
        - id
        - vehicleType
        - created
        - mileage
        - gearbox
        - owner
        - kwAndPs
        - hek
        - taxation
